<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4c9a2a">
  <title>CARGILL - Connexion</title>
  <link rel="icon" href="/logo.png">

  <style>
    :root {
      --green-dark: #2f6b14;
      --green: #4c9a2a;
      --green-light: #8cc63f;
      --ink: #1d2a17;
      --muted: #6b7a63;
      --line: #d9e4d0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 10%, rgba(140,198,63,.35), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(76,154,42,.30), transparent 50%),
        #eef5e6;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(14px, 3vh, 24px);
    }

    .logo-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 0 6px rgba(76,154,42,.15), 0 12px 28px rgba(47,107,20,.30);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: reveal .9s ease-out;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      margin-top: 12px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 4px;
      padding-left: 4px;
      color: var(--green-dark);
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    .form-card {
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px 20px 20px;
      box-shadow: 0 18px 45px rgba(47,107,20,.15);
    }

    .form-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 13px; position: relative; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px 4px;
    }

    input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      background: #f8fbf4;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus {
      border-color: var(--green);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(76,154,42,.15);
    }

    input::placeholder { color: #9aa793; }

    .phone-row { display: flex; gap: 9px; }

    .phone-row #dialCode {
      width: 32%;
      flex: none;
      text-align: center;
      font-weight: 700;
      color: var(--green-dark);
      background: #eef5e6;
    }

    .phone-row #phone { flex: 1; min-width: 0; }

    .password-box { position: relative; }
    .password-box input { padding-right: 76px; }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 8px;
    }

    /* Sélecteur de pays */
    .select-trigger {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      background: #f8fbf4;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .select-trigger:disabled { opacity: .7; cursor: not-allowed; }

    .select-trigger:focus-visible,
    .select.open .select-trigger {
      border-color: var(--green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(76,154,42,.15);
      outline: none;
    }

    .select-trigger .value {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-trigger .value.placeholder { color: #9aa793; }

    .select-trigger .chev {
      width: 14px;
      height: 14px;
      flex: none;
      transition: transform .2s;
    }

    .select.open .chev { transform: rotate(180deg); }

    .select-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 50;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(47,107,20,.22);
      overflow: hidden;
      display: none;
      animation: pop .16s ease-out;
    }

    .select.open .select-panel { display: block; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .select-search {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f4faec, #fff);
    }

    .select-search input {
      height: 38px;
      border-radius: 10px;
      font-size: 13px;
    }

    .select-list {
      list-style: none;
      max-height: 230px;
      overflow-y: auto;
      padding: 6px;
      overscroll-behavior: contain;
    }

    .select-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      color: var(--ink);
    }

    .select-list li .flag { font-size: 18px; line-height: 1; }
    .select-list li .name { flex: 1; }
    .select-list li .code { color: var(--muted); font-size: 12px; font-weight: 600; }

    .select-list li:hover,
    .select-list li.active { background: #eef5e6; }

    .select-list li.selected {
      background: linear-gradient(135deg, var(--green-light), var(--green));
      color: #fff;
    }

    .select-list li.selected .code { color: rgba(255,255,255,.85); }

    .select-list .empty {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      cursor: default;
    }

    .select-list .empty:hover { background: transparent; }

    .select-list::-webkit-scrollbar { width: 6px; }
    .select-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

    .submit-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green-light), var(--green));
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .5px;
      font-family: inherit;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(76,154,42,.30);
      transition: transform .15s, filter .2s;
    }

    .submit-btn:hover { filter: brightness(1.05); }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    .bottom-text {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 16px;
    }

    .bottom-text a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .bottom-text a:hover { text-decoration: underline; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 16px;
    }

    .error {
      color: #d64545;
      font-size: 12px;
      margin: 6px 0 0 4px;
    }

    .error:empty { display: none; }

    /* Notification */
    .toast {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -140%);
      width: calc(100% - 32px);
      max-width: 380px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 18px 45px rgba(47,107,20,.28);
      z-index: 1000;
      opacity: 0;
      transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s;
      pointer-events: none;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .toast-icon {
      width: 36px;
      height: 36px;
      flex: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-light), var(--green));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-icon svg { width: 18px; height: 18px; }
    .toast-title { font-size: 14px; font-weight: 800; color: var(--green-dark); }
    .toast-text { font-size: 12px; color: var(--muted); margin-top: 2px; }

    @media (max-height: 740px) {
      .logo-circle { width: 72px; height: 72px; }
      .brand-name { font-size: 18px; margin-top: 8px; }
      .form-card { padding: 18px 18px 16px; }
      .form-title { margin-bottom: 12px; }
      .field { margin-bottom: 10px; }
      input, .select-trigger { height: 42px; }
      .submit-btn { height: 44px; }
      .bottom-text { margin-top: 12px; }
      .footer { margin-top: 10px; }
    }

    @media (max-height: 640px) {
      body { align-items: flex-start; }
    }
  </style>
</head>

<body>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
  </div>
  <div>
    <div class="toast-title">Connexion réussie</div>
    <div class="toast-text">Bienvenue sur CARGILL !</div>
  </div>
</div>

<main class="container">

  <header class="brand">
    <div class="logo-circle">
      <img src="/logo.png" alt="Logo CARGILL">
    </div>
    <div class="brand-name">CARGILL</div>
  </header>

  <section class="form-card">
    <h1 class="form-title">Connexion</h1>

    <form id="loginForm" novalidate>

      <div class="field">
        <label id="countryLabel">Pays</label>
        <div class="select" id="countrySelect">
          <button type="button" class="select-trigger" id="countryTrigger" disabled
                  aria-haspopup="listbox" aria-expanded="false" aria-labelledby="countryLabel">
            <span class="value placeholder" id="countryValue">Chargement des pays...</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#4c9a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="select-panel" id="countryPanel">
            <div class="select-search">
              <input type="text" id="countrySearch" placeholder="Rechercher un pays"
                     autocomplete="off" spellcheck="false">
            </div>
            <ul class="select-list" id="countryList" role="listbox"></ul>
          </div>
        </div>
        <div id="countryError" class="error"></div>
      </div>

      <div class="field">
        <label for="phone">Numéro de téléphone</label>
        <div class="phone-row">
          <input id="dialCode" type="text" placeholder="+000" readonly tabindex="-1" aria-label="Indicatif">
          <input type="tel" id="phone" placeholder="Votre numéro"
                 autocomplete="tel-national" inputmode="numeric" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Votre mot de passe"
                 autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword">Afficher</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>SE CONNECTER</button>

      <div id="formError" class="error"></div>
    </form>

    <div class="bottom-text">
      Vous n'avez pas encore de compte ?
      <a href="/register">Créer un compte</a>
    </div>
  </section>

  <footer class="footer">© 2026 CARGILL — Tous droits réservés.</footer>

</main>

<script>
  const AUTH_SERVER = "https://kbfnuyojfmhohdbhmmyx.supabase.co/functions/v1/cargill-auth";

  /* ---------- Sélecteur de pays ---------- */
  const countryEl = {
    root: document.getElementById("countrySelect"),
    trigger: document.getElementById("countryTrigger"),
    value: document.getElementById("countryValue"),
    search: document.getElementById("countrySearch"),
    list: document.getElementById("countryList"),
    error: document.getElementById("countryError")
  };
  const dialCodeInput = document.getElementById("dialCode");
  const phoneInput = document.getElementById("phone");
  const passwordInput = document.getElementById("password");
  const submitBtn = document.getElementById("submitBtn");

  let countries = [];
  let selectedCode = "";
  let activeIndex = -1;

  function flagEmoji(iso2) {
    if (!iso2 || iso2.length !== 2) return "";
    return String.fromCodePoint(...iso2.toUpperCase().split("").map(c => 127397 + c.charCodeAt(0)));
  }

  function dial(c) {
    const d = String(c.dial_code || "");
    return d.startsWith("+") ? d : "+" + d;
  }

  function renderList(filter) {
    const q = (filter || "").trim().toLowerCase();
    const items = countries.filter(c =>
      !q || c.name.toLowerCase().includes(q) || dial(c).includes(q) || String(c.code).toLowerCase() === q
    );
    countryEl.list.innerHTML = "";
    activeIndex = -1;

    if (!items.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Aucun pays trouvé";
      countryEl.list.appendChild(li);
      return;
    }

    items.forEach(c => {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.dataset.code = c.code;
      if (c.code === selectedCode) li.classList.add("selected");
      li.innerHTML =
        '<span class="flag">' + flagEmoji(c.code) + '</span>' +
        '<span class="name"></span>' +
        '<span class="code">' + dial(c) + '</span>';
      li.querySelector(".name").textContent = c.name;
      li.addEventListener("click", () => chooseCountry(c.code));
      countryEl.list.appendChild(li);
    });
  }

  function chooseCountry(code) {
    const c = countries.find(x => x.code === code);
    if (!c) return;
    selectedCode = c.code;
    countryEl.value.classList.remove("placeholder");
    countryEl.value.textContent = (flagEmoji(c.code) + "  " + c.name).trim();
    dialCodeInput.value = dial(c);
    countryEl.error.textContent = "";
    closeSelect();
  }

  function openSelect() {
    if (!countries.length) return;
    countryEl.root.classList.add("open");
    countryEl.trigger.setAttribute("aria-expanded", "true");
    countryEl.search.value = "";
    renderList("");
    const sel = countryEl.list.querySelector(".selected");
    if (sel) sel.scrollIntoView({ block: "center" });
    setTimeout(() => { if (window.matchMedia("(hover: hover)").matches) countryEl.search.focus(); }, 30);
  }

  function closeSelect() {
    countryEl.root.classList.remove("open");
    countryEl.trigger.setAttribute("aria-expanded", "false");
  }

  function moveActive(step) {
    const lis = [...countryEl.list.querySelectorAll("li[data-code]")];
    if (!lis.length) return;
    activeIndex = (activeIndex + step + lis.length) % lis.length;
    lis.forEach((li, i) => li.classList.toggle("active", i === activeIndex));
    lis[activeIndex].scrollIntoView({ block: "nearest" });
  }

  countryEl.trigger.addEventListener("click", () => {
    countryEl.root.classList.contains("open") ? closeSelect() : openSelect();
  });
  countryEl.search.addEventListener("input", e => renderList(e.target.value));
  countryEl.search.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const lis = countryEl.list.querySelectorAll("li[data-code]");
      const target = activeIndex >= 0 ? lis[activeIndex] : (lis.length === 1 ? lis[0] : null);
      if (target) chooseCountry(target.dataset.code);
    } else if (e.key === "Escape") { closeSelect(); countryEl.trigger.focus(); }
  });
  countryEl.trigger.addEventListener("keydown", e => { if (e.key === "Escape") closeSelect(); });
  document.addEventListener("click", e => { if (!countryEl.root.contains(e.target)) closeSelect(); });

  /* ---------- Chargement des pays ---------- */
  async function loadCountries() {
    try {
      const response = await fetch(AUTH_SERVER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "countries" })
      });
      let result = {};
      try { result = await response.json(); } catch (e) {}

      if (!response.ok || !result.success || !Array.isArray(result.countries) || !result.countries.length) {
        throw new Error("Impossible de charger les pays.");
      }

      countries = result.countries;
      countryEl.value.textContent = "Sélectionner un pays";
      countryEl.trigger.disabled = false;
      submitBtn.disabled = false;
      renderList("");
    } catch (err) {
      countryEl.value.textContent = "Pays indisponibles";
      countryEl.error.textContent = "Impossible de contacter le serveur. Réessayez.";
      console.error(err);
    }
  }
  loadCountries();

  /* ---------- Afficher / masquer le mot de passe ---------- */
  document.getElementById("togglePassword").addEventListener("click", function () {
    const hidden = passwordInput.type === "password";
    passwordInput.type = hidden ? "text" : "password";
    this.textContent = hidden ? "Masquer" : "Afficher";
  });

  /* ---------- Connexion ---------- */
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const formError = document.getElementById("formError");
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;

    formError.textContent = "";
    if (!selectedCode) { formError.textContent = "Sélectionnez votre pays."; return; }
    if (!/^[0-9]{6,15}$/.test(phone)) { formError.textContent = "Numéro de téléphone invalide."; return; }
    if (!password) { formError.textContent = "Veuillez saisir votre mot de passe."; return; }

    submitBtn.disabled = true;
    const original = submitBtn.textContent;
    submitBtn.textContent = "CONNEXION...";

    try {
      const response = await fetch(AUTH_SERVER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "login",
          country_code: selectedCode,
          phone: phone,
          password: password
        })
      });

      let result = {};
      try { result = await response.json(); } catch (err) {}

      if (!response.ok || !result.success) {
        throw new Error(result.error || "Identifiants incorrects.");
      }
      if (!result.session) {
        throw new Error("Session non reçue du serveur.");
      }

      try { sessionStorage.setItem("cargill_session", result.session); } catch (err) {}

      document.getElementById("toast").classList.add("show");
      setTimeout(() => { window.location.href = "/accueil"; }, 1200);

    } catch (err) {
      formError.textContent = err.message || "Identifiants incorrects.";
      submitBtn.disabled = false;
      submitBtn.textContent = original;
    }
  });
</script>

</body>
</html>
