<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4c9a2a">
  <title>CARGILL - Connexion</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root {
      --green-dark: #2f6b14;
      --green: #4c9a2a;
      --green-light: #8cc63f;
      --ink: #1d2a17;
      --muted: #6b7a63;
      --line: #d9e4d0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 10%, rgba(140,198,63,.35), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(76,154,42,.30), transparent 50%),
        #eef5e6;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Logo dans le cercle ---------- */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(14px, 3vh, 24px);
    }

    .logo-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 0 6px rgba(76,154,42,.15), 0 12px 28px rgba(47,107,20,.30);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: reveal .9s ease-out;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      margin-top: 12px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 4px;
      padding-left: 4px;
      color: var(--green-dark);
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ---------- Carte ---------- */
    .form-card {
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px 20px 20px;
      box-shadow: 0 18px 45px rgba(47,107,20,.15);
    }

    .form-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 13px; position: relative; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px 4px;
    }

    input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      background: #f8fbf4;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus {
      border-color: var(--green);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(76,154,42,.15);
    }

    input::placeholder { color: #9aa793; }

    /* ---------- Sélecteur de pays personnalisé ---------- */
    .select-trigger {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      background: #f8fbf4;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .select-trigger:focus-visible,
    .select.open .select-trigger {
      border-color: var(--green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(76,154,42,.15);
      outline: none;
    }

    .select-trigger .value {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-trigger .value.placeholder { color: #9aa793; }

    .select-trigger .chev {
      width: 14px;
      height: 14px;
      flex: none;
      transition: transform .2s;
    }

    .select.open .chev { transform: rotate(180deg); }

    .select-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 50;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(47,107,20,.22);
      overflow: hidden;
      display: none;
      animation: pop .16s ease-out;
    }

    .select.open .select-panel { display: block; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .select-search {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f4faec, #fff);
    }

    .select-search input {
      height: 38px;
      border-radius: 10px;
      font-size: 13px;
    }

    .select-list {
      list-style: none;
      max-height: 230px;
      overflow-y: auto;
      padding: 6px;
      overscroll-behavior: contain;
    }

    .select-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      color: var(--ink);
    }

    .select-list li .flag { font-size: 18px; line-height: 1; }
    .select-list li .name { flex: 1; }
    .select-list li .code { color: var(--muted); font-size: 12px; font-weight: 600; }

    .select-list li:hover,
    .select-list li.active {
      background: #eef5e6;
    }

    .select-list li.selected {
      background: linear-gradient(135deg, var(--green-light), var(--green));
      color: #fff;
    }

    .select-list li.selected .code { color: rgba(255,255,255,.85); }

    .select-list .empty {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      cursor: default;
    }

    .select-list .empty:hover { background: transparent; }

    .select-list::-webkit-scrollbar { width: 6px; }
    .select-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

    /* ---------- Bouton ---------- */
    .submit-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green-light), var(--green));
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .5px;
      font-family: inherit;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(76,154,42,.30);
      transition: transform .15s, filter .2s;
    }

    .submit-btn:hover { filter: brightness(1.05); }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    .bottom-text {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 16px;
    }

    .bottom-text a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .bottom-text a:hover { text-decoration: underline; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 16px;
    }

    .error {
      color: #d64545;
      font-size: 12px;
      margin: 6px 0 0 4px;
    }

    .error:empty { display: none; }

    /* ---------- Notification ---------- */
    .toast {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -140%);
      width: calc(100% - 32px);
      max-width: 380px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 18px 45px rgba(47,107,20,.28);
      z-index: 1000;
      opacity: 0;
      transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s;
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast-icon {
      width: 36px;
      height: 36px;
      flex: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-light), var(--green));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-icon svg { width: 18px; height: 18px; }

    .toast-title { font-size: 14px; font-weight: 800; color: var(--green-dark); }
    .toast-text { font-size: 12px; color: var(--muted); margin-top: 2px; }

    @media (max-height: 740px) {
      .logo-circle { width: 72px; height: 72px; }
      .brand-name { font-size: 18px; margin-top: 8px; }
      .form-card { padding: 18px 18px 16px; }
      .form-title { margin-bottom: 12px; }
      .field { margin-bottom: 10px; }
      input, .select-trigger { height: 42px; }
      .submit-btn { height: 44px; }
      .bottom-text { margin-top: 12px; }
      .footer { margin-top: 10px; }
    }

    @media (max-height: 640px) {
      body { align-items: flex-start; }
    }
  
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 52px; }
    .toggle-password { position:absolute; right:8px; top:7px; height:32px; min-width:38px; border:0; border-radius:9px; background:#eef5e6; color:var(--green-dark); font-weight:700; cursor:pointer; }
    .submit-btn:disabled { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
  <div><div class="toast-title">Connexion réussie</div><div class="toast-text">Redirection vers votre espace...</div></div>
</div>
<main class="container">
  <header class="brand">
    <div class="logo-circle"><img src="/logo.png" alt="Logo CARGILL"></div>
    <div class="brand-name">CARGILL</div>
  </header>
  <section class="form-card">
    <h1 class="form-title">Connexion</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <label id="countryLabel">Pays</label>
        <input type="hidden" id="country" value="">
        <div class="select" id="countrySelect">
          <button type="button" class="select-trigger" id="countryTrigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="countryLabel">
            <span class="value placeholder" id="countryValue">Chargement des pays...</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#4c9a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="select-panel" id="countryPanel">
            <div class="select-search"><input type="text" id="countrySearch" placeholder="Rechercher un pays" autocomplete="off" spellcheck="false"></div>
            <ul class="select-list" id="countryList" role="listbox"></ul>
          </div>
        </div>
        <div id="countryError" class="error"></div>
      </div>
      <div class="field">
        <label for="phone">Numéro de téléphone</label>
        <input type="tel" id="phone" placeholder="Votre numéro de téléphone" autocomplete="tel-national" inputmode="tel" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Afficher le mot de passe">Voir</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">SE CONNECTER</button>
      <div id="formError" class="error" role="alert"></div>
    </form>
    <div class="bottom-text">Vous n'avez pas encore de compte ? <a href="/">Créer un compte</a></div>
  </section>
  <footer class="footer">© 2026 CARGILL — Tous droits réservés.</footer>
</main>
<script>
  const SUPABASE_URL = "https://kbfnuyojfmhohdbhmmyx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_L2xd9D-rR_VgSJaMJDw4ig_jyHgQ_Hw";
  function sbHeaders(extra) {
    const h = { "Accept": "application/json" };
    if (SUPABASE_ANON_KEY) h.apikey = SUPABASE_ANON_KEY;
    return Object.assign(h, extra || {});
  }

  const countryEl = {
    root: document.getElementById("countrySelect"),
    trigger: document.getElementById("countryTrigger"),
    value: document.getElementById("countryValue"),
    search: document.getElementById("countrySearch"),
    list: document.getElementById("countryList"),
    hidden: document.getElementById("country"),
    error: document.getElementById("countryError")
  };
  let countries = [];
  let activeIndex = -1;
  function flagEmoji(iso2) {
    if (!iso2 || iso2.length !== 2) return "";
    return String.fromCodePoint(...iso2.toUpperCase().split("").map(c => 127397 + c.charCodeAt(0)));
  }
  function cleanCode(c) { return "+" + String(c.calling_code).replace(/^\+/, ""); }
  function renderList(filter) {
    const q = (filter || "").trim().toLowerCase();
    const items = countries.filter(c => !q || c.name.toLowerCase().includes(q) || cleanCode(c).includes(q) || c.iso2.toLowerCase() === q);
    countryEl.list.innerHTML = ""; activeIndex = -1;
    if (!items.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = "Aucun pays trouvé"; countryEl.list.appendChild(li); return;
    }
    items.forEach(c => {
      const li = document.createElement("li"); li.setAttribute("role", "option"); li.dataset.iso = c.iso2;
      if (c.iso2 === countryEl.hidden.value) li.classList.add("selected");
      li.innerHTML = '<span class="flag">' + flagEmoji(c.iso2) + '</span><span class="name"></span><span class="code">' + cleanCode(c) + '</span>';
      li.querySelector(".name").textContent = c.name;
      li.addEventListener("click", () => chooseCountry(c.iso2)); countryEl.list.appendChild(li);
    });
  }
  function chooseCountry(iso2) {
    const c = countries.find(x => x.iso2 === iso2); if (!c) return;
    countryEl.hidden.value = c.iso2; countryEl.value.classList.remove("placeholder");
    countryEl.value.textContent = flagEmoji(c.iso2) + "  " + c.name + " (" + cleanCode(c) + ")";
    countryEl.error.textContent = ""; closeSelect();
  }
  function openSelect() {
    if (!countries.length) return;
    countryEl.root.classList.add("open"); countryEl.trigger.setAttribute("aria-expanded", "true");
    countryEl.search.value = ""; renderList("");
    const sel = countryEl.list.querySelector(".selected"); if (sel) sel.scrollIntoView({block:"center"});
    countryEl.search.focus();
  }
  function closeSelect() { countryEl.root.classList.remove("open"); countryEl.trigger.setAttribute("aria-expanded", "false"); }
  function moveActive(step) {
    const lis = [...countryEl.list.querySelectorAll("li[data-iso]")]; if (!lis.length) return;
    activeIndex = (activeIndex + step + lis.length) % lis.length;
    lis.forEach((li,i) => li.classList.toggle("active", i === activeIndex)); lis[activeIndex].scrollIntoView({block:"nearest"});
  }
  countryEl.trigger.addEventListener("click", () => countryEl.root.classList.contains("open") ? closeSelect() : openSelect());
  countryEl.search.addEventListener("input", e => renderList(e.target.value));
  countryEl.search.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
    else if (e.key === "Enter") { e.preventDefault(); const lis = countryEl.list.querySelectorAll("li[data-iso]"); const target = activeIndex >= 0 ? lis[activeIndex] : (lis.length === 1 ? lis[0] : null); if (target) chooseCountry(target.dataset.iso); }
    else if (e.key === "Escape") { closeSelect(); countryEl.trigger.focus(); }
  });
  document.addEventListener("click", e => { if (!countryEl.root.contains(e.target)) closeSelect(); });
  async function loadCountries() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/eligible_countries?select=iso2,name,calling_code&is_active=eq.true&order=name.asc`, {headers:sbHeaders()});
      if (!response.ok) throw new Error("Impossible de charger les pays.");
      countries = await response.json(); if (!countries.length) throw new Error("Aucun pays disponible.");
      countryEl.value.textContent = "Sélectionner un pays"; renderList("");
      if (countries.some(c => c.iso2 === "BF")) chooseCountry("BF");
    } catch (err) { countryEl.value.textContent = "Pays indisponibles"; countryEl.error.textContent = err.message; }
  }
  loadCountries();

  document.getElementById("togglePassword").addEventListener("click", function() {
    const p = document.getElementById("password");
    const visible = p.type === "password"; p.type = visible ? "text" : "password"; this.textContent = visible ? "Cacher" : "Voir";
    this.setAttribute("aria-label", visible ? "Masquer le mot de passe" : "Afficher le mot de passe");
  });

  function readableError(value) {
    if (typeof value === "string") return value;
    if (value && typeof value === "object") {
      return value.message || value.error_description || value.error ||
        value.details || value.hint || JSON.stringify(value);
    }
    return "Connexion impossible. Vérifiez vos informations.";
  }

  async function loginUser(data) {
    const response = await fetch("/api/cargill-auth/login", {
      method: "POST",
      headers: {"Accept":"application/json", "Content-Type":"application/json"},
      credentials: "same-origin",
      body: JSON.stringify({
        country_iso2: data.country,
        phone_number: data.phone,
        password: data.password
      })
    });

    const raw = await response.text();
    let result = {};
    if (raw) {
      try { result = JSON.parse(raw); }
      catch (_) { result = {message: raw}; }
    }

    if (!response.ok) {
      throw new Error(readableError(result) || `Erreur de connexion (HTTP ${response.status}).`);
    }
    return result;
  }
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const error = document.getElementById("formError"); const btn = document.getElementById("submitBtn");
    const country = countryEl.hidden.value; const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    error.textContent = "";
    if (!country) { error.textContent = "Veuillez sélectionner un pays."; return; }
    if (!phone) { error.textContent = "Veuillez saisir votre numéro de téléphone."; return; }
    if (!password) { error.textContent = "Veuillez saisir votre mot de passe."; return; }
    btn.disabled = true; const original = btn.textContent; btn.textContent = "CONNEXION...";
    try {
      const result = await loginUser({country, phone, password});
      document.getElementById("toast").classList.add("show");
      const destination = result.redirect_url || "/dashboard";
      setTimeout(() => { window.location.href = destination; }, 900);
    } catch (err) { error.textContent = err.message; btn.disabled = false; btn.textContent = original; }
  });
</script>
</body>
</html>
